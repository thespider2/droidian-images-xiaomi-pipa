name: droidian rootfs-builder

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "59 23 * * *"

permissions:
  contents: write

jobs:
  once:
    runs-on: ubuntu-latest
    name: Generate matrix
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
      versions: ${{ steps.gen-matrix.outputs.versions }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate matrix
        id: gen-matrix
        run: |
          JOBS="$(./generate_device_recipe.py --matrix)"
          echo "matrix=${JOBS}" >> $GITHUB_OUTPUT

          if [[ "${{ github.ref }}" == refs/tags/droidian* ]]; then
            VER="$(echo '${{ github.ref_name }}' | rev | cut -d'/' -f1 | rev)"
            echo "versions=[\"${VER}\"]" >> $GITHUB_OUTPUT
          else
            echo 'versions=["current","next"]' >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ubuntu-24.04-arm
    needs: once

    strategy:
      fail-fast: true
      matrix:
        config: ${{ fromJson(needs.once.outputs.matrix) }}
        droidian_version: ${{ fromJson(needs.once.outputs.versions) }}

    name: ${{ matrix.config.job_name }} (${{ matrix.droidian_version }})

    steps:
      - name: Get current date
        run: echo "current_date=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Set suffix
        run: echo "release_suffix=_${{ env.current_date }}" >> $GITHUB_ENV

      - name: Set Droidian version
        run: echo "DROIDIAN_VERSION=${{ matrix.droidian_version }}" >> $GITHUB_ENV

      - name: Set builder image tag
        run: |
          case "${{ matrix.droidian_version }}" in
            current|next) echo "BUILDER_TAG=${{ matrix.droidian_version }}" >> $GITHUB_ENV ;;
            *) echo "BUILDER_TAG=current" >> $GITHUB_ENV ;;
          esac

      - name: Set identifier
        run: echo "DROIDIAN_IDENTIFIER=${{ matrix.config.product }}-${{ matrix.config.arch }}-${{ matrix.config.edition }}-${{ matrix.config.variant }}-${{ matrix.config.apilevel }}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'true'
          submodules: 'recursive'

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Create build dir
        run: mkdir -p /tmp/buildd-results

      - name: Pull container
        run: docker pull quay.io/droidian/rootfs-builder:${{ env.BUILDER_TAG }}-arm64

      - name: Start Container
        run: echo CONTAINER_HASH=$(docker run --detach --privileged --cgroupns=host -v /tmp/buildd-results:/buildd/out -v /dev:/host-dev -v /sys/fs/cgroup:/sys/fs/cgroup -v ${PWD}:/buildd/sources --security-opt seccomp:unconfined quay.io/droidian/rootfs-builder:${{ env.BUILDER_TAG }}-arm64 sleep infinity) >> $GITHUB_ENV

      - name: Build rootfs
        run: |
          docker exec $CONTAINER_HASH /bin/sh -c 'cd /buildd/sources; DROIDIAN_VERSION="${{ env.DROIDIAN_VERSION }}" ./generate_device_recipe.py ${{ matrix.config.product }} ${{ matrix.config.arch }} ${{ matrix.config.edition }} ${{ matrix.config.variant }} ${{ matrix.config.apilevel }} ${{ matrix.config.droidian_variant }} && debos --disable-fakemachine generated/droidian.yaml'

      - name: Fix out/ permissions
        run: sudo chmod -R 777 out/

      - name: Copy fastboot zip for installer
        if: matrix.config.product == 'xiaomi_pipa'
        run: cp out/*.zip "out/image-fastboot-pipa.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: droidian-out-${{ matrix.droidian_version }}-${{ matrix.config.product }}-${{ matrix.config.arch }}-${{ matrix.config.edition }}-${{ matrix.config.variant }}-${{ matrix.config.apilevel }}
          path: out/*
          if-no-files-found: error
          retention-days: 1

  prepare:
    runs-on: ubuntu-latest
    name: Create GitHub release (${{ matrix.droidian_version }})
    needs: [once, build]
    strategy:
      fail-fast: false
      matrix:
        droidian_version: ${{ fromJson(needs.once.outputs.versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up some storage
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set release tag
        id: release-tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/droidian* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "is_stable=true" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ matrix.droidian_version }}" >> $GITHUB_OUTPUT
            echo "is_stable=false" >> $GITHUB_OUTPUT
          fi

      - name: Recreate version tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.release-tag.outputs.is_stable != 'true'
        run: |
          TAG="${{ steps.release-tag.outputs.tag }}"
          gh release delete "${TAG}" --yes || true
          git push --delete origin "refs/tags/${TAG}" || true
          # Drop legacy nightly tag once while migrating
          if [ "${TAG}" = "current" ]; then
            gh release delete nightly --yes || true
            git push --delete origin refs/tags/nightly || true
          fi
          gh release create "${TAG}" --prerelease --title "${TAG}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: droidian-out-${{ matrix.droidian_version }}-*
          path: droidian-out
          merge-multiple: false

      - name: Create SHA256SUMS
        run: |
          cd droidian-out
          for x in droidian-out-*; do
            [ -d "$x" ] || continue
            cd "$x"
            sha256sum * >> ../SHA256SUMS
            cd ..
          done

      - name: Create stable release (drafted)
        if: steps.release-tag.outputs.is_stable == 'true'
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: droidian-out/SHA256SUMS
          tag_name: ${{ steps.release-tag.outputs.tag }}
          draft: true
          prerelease: false

      - name: Create version release
        if: steps.release-tag.outputs.is_stable != 'true'
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: droidian-out/SHA256SUMS
          tag_name: ${{ steps.release-tag.outputs.tag }}
          draft: false
          prerelease: true

  publish:
    runs-on: ubuntu-latest
    needs: [once, prepare]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.once.outputs.matrix) }}
        droidian_version: ${{ fromJson(needs.once.outputs.versions) }}

    name: Publish ${{ matrix.config.job_name }} (${{ matrix.droidian_version }})

    steps:
      - name: Set release tag
        id: release-tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/droidian* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "is_stable=true" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ matrix.droidian_version }}" >> $GITHUB_OUTPUT
            echo "is_stable=false" >> $GITHUB_OUTPUT
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: droidian-out-${{ matrix.droidian_version }}-${{ matrix.config.product }}-${{ matrix.config.arch }}-${{ matrix.config.edition }}-${{ matrix.config.variant }}-${{ matrix.config.apilevel }}
          path: droidian-out

      - name: Create stable release (drafted)
        if: steps.release-tag.outputs.is_stable == 'true'
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: droidian-out/*
          tag_name: ${{ steps.release-tag.outputs.tag }}
          draft: true
          prerelease: false

      - name: Create version release
        if: steps.release-tag.outputs.is_stable != 'true'
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: droidian-out/*
          tag_name: ${{ steps.release-tag.outputs.tag }}
          draft: false
          prerelease: true
